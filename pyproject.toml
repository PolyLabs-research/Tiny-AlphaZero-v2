[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyalphazero"
version = "0.1.0"
description = "A ground-up rebuild of TinyAlphaZero implementing the AlphaZero loop for chess"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "chess>=1.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4.0",
    "py-spy>=0.3",
]

# AGENTS.md §2: torch must never resolve from PyPI on this box — those are CUDA
# wheels that import fine and run CPU-only forever. Pin the ROCm index so
# `uv pip install -e ".[dev]"` (make install, HOW_TO_TRAIN) cannot drift back.
# The installed build is 2.12.1+rocm7.2; move the index with the stack, not before.
[tool.uv.sources]
torch = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/tinyalphazero"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "RET", "SIM", "TID"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "golden: the Phase 2 golden mini-run (spec §9.4) — CPU, under 3 minutes",
    "slow: subprocess/SIGKILL crash-resume tests; minutes, not seconds",
]
