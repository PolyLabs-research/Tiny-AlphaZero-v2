# p2_f — carry the replay ring across the round boundary (2026-10-23)
#
# Resolves to exactly runs/p2_e/config.yaml, ladder cadence and rungs included
# (eval_every_n_iters 5; random, greedy, phase1, stockfish:0), so the launch needs
# no ladder flags. The one lever is not a config field: it is the launch flag
# `--seed-replay runs/p2_e`, which opens the run on p2_e's committed replay ring
# instead of an empty one (RUNLOG-p2_e §4, PREREG-p2_f). The league is continued
# with `--seed-pool runs/p2_e` as in every warm-started round; that is continuity,
# not a lever.
#
# tests/test_rehearsal.py::test_p2f_config_is_the_brief asserts ZERO deltas against
# runs/p2_e/config.yaml. PREREG-p2_f.md is the brief.
eval:
  anchor_ckpt: runs/phase1_anchor.pt
  anchor_digest: 27dcdd05f7d578e7cc3e833d0def0d6e1794d1138144da4f79f6037aa7c84ef5
  anchor_games: 200
  bootstrap_resamples: 10000
  eval_every_n_iters: 5
  eval_match_max_plies: 300
  eval_match_sims: 48
  eval_seed: null
  ladder_anchors: random,greedy,phase1,stockfish:0
  openings_path: tests/suites/openings_4ply.epd
  stockfish_path: ''
  suite_sims: 128
mcts:
  batch_leaves: 512
  c_puct: 1.25
  c_scale: 1.0
  c_visit: 50.0
  dirichlet_alpha: 0.3
  dirichlet_frac: 0.25
  eval_c_scale: null
  eval_c_visit: null
  eval_m: null
  eval_proof_directed_expansion: null
  gumbel_m: 16
  promo_prior_from_head: false
  proof_directed_expansion: false
  proof_q_threshold: 0.95
  root_mode: gumbel
  root_noise: true
  sims: 48
  temperature_ply_cutoff: 30
model:
  attn_init: torch_default
  aux_legality: true
  d_ff: 1024
  d_model: 256
  d_policy: 128
  dropout: 0.0
  n_heads: 8
  n_layers: 8
  seq_len: 72
phase2:
  iterations: 1000
  league_opponents_per_iter: 4
  masked_policy: true
  nan_abort_frac: 0.01
  nan_abort_min_steps: 20
  train_on_pool_moves: true
seed: 42
selfplay:
  concurrent_games: 256
  games_per_iteration: 512
  league_latest_frac: 0.8
  league_pool_size: 20
  max_plies: 160
  resign_consecutive: 8
  resign_disabled_frac: 0.1
  resign_threshold: -0.9
  sims_per_move: 48
train:
  batch_size: 1024
  grad_clip: 1.0
  legality_loss_weight: 0.0
  lr: 0.0002
  phase1_anchor_weighting: legacy
  phase1_epochs: 3
  phase1_lr_end: 3.0e-05
  phase1_lr_start: 0.0003
  phase1_mate1_mix: 0.05
  phase1_mate2_mix: 0.0
  phase1_policy_masked: false
  phase1_value_weight_anchor: 1.0
  phase1_value_weight_random: 0.25
  policy_loss_weight: 1.0
  promo_loss_weight: 1.0
  rehearsal_frac: 0.05
  rehearsal_mate1_dir: runs/data/mate1_100k_clean
  rehearsal_mate1_frac: 0.02
  rehearsal_mate2_dir: runs/data/mate2_50k_clean
  rehearsal_mate2_frac: 0.03
  replay_capacity: 500000
  train_steps_per_iter: 400
  value_loss_weight: 1.0
  value_q_blend: batch_mean
  value_q_mse_weight: 0.5
  weight_decay: 0.0001
