# p2_k, arm "lr" — p2_g's config with the learning rate stepped down tenfold (PREREG-p2_k.md, DRAFT).
#
# Exactly one field differs from configs/p2_g.yaml (tests/test_rehearsal.py::test_p2k_lr_config_is_the_brief):
#   train.lr: 2.0e-05   constant, like p2_g's 2e-4; --init starts a fresh AdamW at it. AdamW's
#                       decoupled weight decay is applied as lr x weight_decay, so it steps down with it.
# The continuation arm runs configs/p2_g.yaml itself. Both: --iterations 20 at the invocation.
#
# p2_g — diverse self-play openings, one long continuous round, trained on RunPod (2026-10-24)
#
# Resolves to runs/p2_f/config.yaml with exactly four deltas, asserted by
# tests/test_rehearsal.py::test_p2g_config_is_the_brief:
#   selfplay.opening_random_plies: 8   the lever: each game starts k ~ U{0..8} random
#                                      plies in; the skill-0 rung's book is excluded
#   selfplay.actor_processes: 20       throughput only (the ring is the same games)
#   eval.eval_every_n_iters: 0         no inline ladder on the pod; every measurement
#                                      runs on the local box, on the local instrument
#   phase2.iterations: 60              one long round, judged on its trajectory
# Continuity, not levers: --seed-pool and --seed-replay from runs/p2_f.
# PREREG-p2_g.md is the brief.
eval:
  anchor_ckpt: runs/phase1_anchor.pt
  anchor_digest: 27dcdd05f7d578e7cc3e833d0def0d6e1794d1138144da4f79f6037aa7c84ef5
  anchor_games: 200
  bootstrap_resamples: 10000
  eval_every_n_iters: 0
  eval_match_max_plies: 300
  eval_match_sims: 48
  eval_seed: null
  ladder_anchors: random,greedy,phase1,stockfish:0
  openings_path: tests/suites/openings_4ply.epd
  stockfish_path: ''
  suite_sims: 128
mcts:
  batch_leaves: 512
  c_puct: 1.25
  c_scale: 1.0
  c_visit: 50.0
  dirichlet_alpha: 0.3
  dirichlet_frac: 0.25
  eval_c_scale: null
  eval_c_visit: null
  eval_m: null
  eval_proof_directed_expansion: null
  gumbel_m: 16
  promo_prior_from_head: false
  proof_directed_expansion: false
  proof_q_threshold: 0.95
  root_mode: gumbel
  root_noise: true
  sims: 48
  temperature_ply_cutoff: 30
model:
  attn_init: torch_default
  aux_legality: true
  d_ff: 1024
  d_model: 256
  d_policy: 128
  dropout: 0.0
  n_heads: 8
  n_layers: 8
  seq_len: 72
phase2:
  iterations: 60
  league_opponents_per_iter: 4
  masked_policy: true
  nan_abort_frac: 0.01
  nan_abort_min_steps: 20
  train_on_pool_moves: true
seed: 42
selfplay:
  actor_processes: 20
  concurrent_games: 256
  games_per_iteration: 512
  league_latest_frac: 0.8
  league_pool_size: 20
  max_plies: 160
  opening_exclude: tests/suites/openings_4ply.epd
  opening_random_plies: 8
  resign_consecutive: 8
  resign_disabled_frac: 0.1
  resign_threshold: -0.9
  sims_per_move: 48
train:
  batch_size: 1024
  grad_clip: 1.0
  legality_loss_weight: 0.0
  lr: 2.0e-05
  phase1_anchor_weighting: legacy
  phase1_epochs: 3
  phase1_lr_end: 3.0e-05
  phase1_lr_start: 0.0003
  phase1_mate1_mix: 0.05
  phase1_mate2_mix: 0.0
  phase1_policy_masked: false
  phase1_value_weight_anchor: 1.0
  phase1_value_weight_random: 0.25
  policy_loss_weight: 1.0
  promo_loss_weight: 1.0
  rehearsal_frac: 0.05
  rehearsal_mate1_dir: runs/data/mate1_100k_clean
  rehearsal_mate1_frac: 0.02
  rehearsal_mate2_dir: runs/data/mate2_50k_clean
  rehearsal_mate2_frac: 0.03
  replay_capacity: 500000
  train_steps_per_iter: 400
  value_loss_weight: 1.0
  value_q_blend: batch_mean
  value_q_mse_weight: 0.5
  weight_decay: 0.0001
