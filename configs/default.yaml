# TinyAlphaZero v2 — default configuration (spec defaults §4.1, §6.2, §7)
seed: 42

model:
  aux_legality: true
  d_ff: 1024
  d_model: 256
  d_policy: 128
  dropout: 0.1
  n_heads: 8
  n_layers: 8
  seq_len: 72

mcts:
  batch_leaves: 512
  c_puct: 1.25
  c_scale: 1.0
  c_visit: 50.0
  dirichlet_alpha: 0.3
  dirichlet_frac: 0.25
  gumbel_m: 16
  root_mode: gumbel
  sims: 48
  temperature_ply_cutoff: 30

selfplay:
  concurrent_games: 256
  games_per_iteration: 512
  league_latest_frac: 0.8
  league_pool_size: 20
  max_plies: 160
  resign_consecutive: 8
  resign_disabled_frac: 0.1
  resign_threshold: -0.9
  sims_per_move: 48

train:
  batch_size: 1024
  grad_clip: 1.0
  legality_loss_weight: 1.0
  lr: 0.0002
  phase1_epochs: 3
  phase1_lr_end: 3.0e-05
  phase1_lr_start: 0.0003
  phase1_mate1_mix: 0.05
  phase1_value_weight_anchor: 1.0
  phase1_value_weight_random: 0.25
  policy_loss_weight: 1.0
  promo_loss_weight: 1.0
  replay_capacity: 500000
  train_steps_per_iter: 400
  value_loss_weight: 1.0
  weight_decay: 0.0001

eval:
  anchor_games: 200
  bootstrap_resamples: 10000
  eval_every_n_iters: 10
  openings_path: tests/suites/openings_4ply.epd
  stockfish_path: ''
  suite_sims: 128
